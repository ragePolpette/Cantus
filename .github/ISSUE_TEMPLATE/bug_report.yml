name: Bug report
description: Report a reproducible failure in analysis, setup or an agent workflow.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Cantus commit or version, OS, Node version, installation method and agent version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact command and smallest example that reproduces the failure. Remove private code and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: For analysis problems, identify the API, caller or dependency you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Relevant output or diagnostics, with sensitive information removed.
    validations:
      required: true
