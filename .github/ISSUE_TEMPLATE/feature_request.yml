name: Feature request
description: Propose a change with a concrete codebase or agent use case.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today? Include an example and your current workaround.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the observable improvement and how you would verify it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and alternatives
      description: The smallest useful change, alternatives and relevant constraints.
